[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlr-latent-residuals"
version = "0.1.0"
description = "Reference implementation of Duplicated Latent Residuals for low-rank pre-training."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Dong Wang" },
  { name = "Wenwu Tang" },
  { name = "Yun Cheng" },
  { name = "Olga Saukh" },
]
dependencies = [
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["dlr*"]
